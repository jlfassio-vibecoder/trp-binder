<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Master Strategy Brief — internal guiding document for the TRP Application Binder (not a submission exhibit).">
    <title>Master Strategy Brief | Guiding Document</title>

    <!-- Tailwind CSS (Play CDN, with typography plugin for prose styling) -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Merriweather -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <!-- Markdown renderer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#f0f4f8', 100: '#d9e2ec', 200: '#bccadc', 300: '#9fb3c8',
                            400: '#829ab1', 500: '#627d98', 600: '#486581', 700: '#334e68',
                            800: '#243b53', 900: '#102a43', 950: '#0b1d30',
                        },
                        gold: {
                            50: '#fffbe6', 100: '#fff1b8', 200: '#ffe58f', 300: '#ffd666',
                            400: '#ffc069', 500: '#faad14', 600: '#d48806', 700: '#ad6800',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; font-size: 11pt; }
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,0.7); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col transition-colors duration-200">

    <header class="no-print bg-navy-900 text-white border-b border-navy-700 sticky top-0 z-40 shadow-md">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="p-2 bg-navy-800 border border-gold-500/40 rounded-lg text-gold-400">
                        <i class="fa-solid fa-compass text-xl"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="px-2 py-0.5 text-xs font-semibold uppercase tracking-wider bg-gold-500/20 text-gold-300 border border-gold-500/30 rounded">
                                Guiding Document
                            </span>
                            <span class="text-xs text-slate-400">| Not a Binder Exhibit</span>
                        </div>
                        <h1 class="text-lg font-bold tracking-tight text-white">
                            Master Strategy Brief
                        </h1>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="window.print()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded font-medium flex items-center gap-1.5 transition" title="Print or Save to PDF">
                        <i class="fa-solid fa-print"></i>
                        <span class="hidden sm:inline">Print / PDF</span>
                    </button>
                    <a href="index.html" class="px-3 py-1.5 bg-navy-800 hover:bg-navy-700 text-white rounded font-medium flex items-center gap-1.5 transition border border-navy-700" title="Back to Binder">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span class="hidden sm:inline">Back to Binder</span>
                    </a>
                    <button id="themeToggle" class="p-1.5 bg-navy-800 hover:bg-navy-700 text-slate-300 hover:text-white rounded border border-navy-700 transition" title="Toggle Dark Mode">
                        <i class="fa-solid fa-moon dark:hidden"></i>
                        <i class="fa-solid fa-sun hidden dark:inline text-gold-400"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto px-2 sm:px-4 lg:px-8 py-6 flex flex-col">
        <div class="no-print mb-4 px-4 py-3 rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-300 dark:border-amber-700 text-sm text-amber-900 dark:text-amber-200 flex items-start gap-2">
            <i class="fa-solid fa-circle-info mt-0.5"></i>
            <span>This brief is an internal planning document. It guides what goes into the TRP Application Binder as the case progresses — it is not itself a binder tab or submission exhibit.</span>
        </div>

        <div id="brief-content" class="binder-container flex-grow bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 p-4 sm:p-8">
            <p class="text-slate-500 dark:text-slate-400 text-sm">Loading brief…</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const themeBtn = document.getElementById('themeToggle');
            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark');
                });
            }

            const target = document.getElementById('brief-content');
            try {
                const res = await fetch('strategy/Master_Strategy_Brief_v2_July_2026.md');
                if (!res.ok) throw new Error('Fetch failed: ' + res.status);
                const md = await res.text();
                target.innerHTML = `<div class="prose prose-slate dark:prose-invert max-w-none prose-headings:font-sans prose-a:text-navy-700 dark:prose-a:text-gold-400 prose-table:text-sm">${marked.parse(md)}</div>`;
            } catch (err) {
                target.innerHTML = `<p class="text-red-600 dark:text-red-400 text-sm">Unable to load the brief (${err.message}). Open <code>strategy/Master_Strategy_Brief_v2_July_2026.md</code> directly.</p>`;
            }
        });
    </script>
</body>
</html>
